<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kirjaudu - Vire</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="keskitetty">
    <p class="logo">Vire</p>
    <h1>Kirjaudu sisään</h1>
    <p class="harmaa">Pieniä tekoja. Vahvempi sinä.</p>

    <form action="index.html" method="post">
      <label for="kayttajatunnus">Käyttäjätunnus</label>
      <input type="text" id="kayttajatunnus" name="kayttajatunnus" required>

      <label for="salasana">Salasana</label>
      <input type="password" id="salasana" name="salasana" required>

      <button type="submit" class="nappi">Kirjaudu</button>
    </form>

    <p>Ei vielä tunnusta? <a href="rekisterointi.html">Rekisteröidy</a></p>
  </main>
</body>
</html>
